<!doctype html>
<html>
<head><title>RAG Document Q&A</title></head>
<body>
  <h1>RAG Document Q&A</h1>

  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="document" accept=".pdf,.docx,.txt">
    <button type="submit">Upload</button>
  </form>

  {% if filename %}
    <p>Loaded document: <b>{{ filename }}</b></p>

    <form method="POST">
      <input type="text" name="question" placeholder="Ask a question" size="60" required>
      <button type="submit">Ask</button>
    </form>
  {% endif %}

  {% if question %}
    <h3>Q: {{ question }}</h3>
    <p>{{ answer }}</p>
  {% endif %}
</body>
</html>
